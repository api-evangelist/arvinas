aid: arvinas
name: Arvinas
description: >-
  Arvinas is a clinical-stage biopharmaceutical company (NASDAQ: ARVN)
  headquartered in New Haven, Connecticut, developing targeted protein
  degradation therapeutics using its proprietary PROTAC (proteolysis targeting
  chimera) Discovery Engine. PROTAC molecules are heterobifunctional protein
  degraders that harness the body's natural protein-disposal system to eliminate
  disease-causing proteins rather than merely inhibiting them, with a therapeutic
  focus on oncology and neurology. Arvinas developed the first FDA-approved PROTAC
  protein degrader, VEPPANU (vepdegestrant). The company was founded on research
  from Yale University and maintains research partnerships across the industry.
  This profile was surfaced as a portfolio company of Canaan Partners and added to
  the API Evangelist network; Arvinas is a life-sciences company and does not
  publish a public developer API surface.
